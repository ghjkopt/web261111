<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>내 영화 보드</title>

    <!-- 구글 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">

    <!-- CSS 연결 -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 헤더 -->
    <header class="top">
        <h1>내 영화 보드</h1>

        <nav>
            <ul>
                <li><a href="#mine">영상미 영화</a></li>
                <li><a href="detail.html">상세</a></li>
            </ul>
        </nav>
    </header>

    <!-- 히어로 -->
    <section class="hero">
        <h2>내 취향 영상미 좋은 영화들</h2>
        <p>포스터 위에 마우스를 올려 보세요.</p>
    </section>

    <main>

        <!-- 내 인생 영화 -->
        <section id="mine">
            <h2>내 인생 영화</h2>

            <!-- 영화 개수 및 정렬 -->
            <div class="toolbar">
                <p id="count"></p>

                <label for="sort">정렬</label>
                <select id="sort" onchange="applySort()">
                    <option value="rating">평점순</option>
                    <option value="year">최신 개봉순</option>
                    <option value="title">제목순</option>
                </select>
            </div>

            <!-- 자바스크립트가 영화 카드를 생성하는 공간 -->
            <section class="board" id="board"></section>

        </section>

    </main>

    <!-- 푸터 -->
    <footer>
        <p>
            이 사이트는 TMDB API를 사용하지만 TMDB의 보증이나 인증을 받지 않았습니다.
            This product uses the TMDB API but is not endorsed or certified by TMDB.
        </p>

        <p>포스터와 영화 정보: TMDB (https://www.themoviedb.org)</p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>

</body>
</html>
